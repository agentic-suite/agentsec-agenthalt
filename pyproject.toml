[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec-agenthalt"
description = "The universal agent kill-switch: one command composes a stop across process tree, credentials, MCP gateway and sandbox, preserves hash-chained evidence, and proves the stop happened."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "agentic-suite" }]
keywords = ["agents", "kill-switch", "halt", "containment", "mcp", "security", "incident-response"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
# stdlib-only runtime (M0 design §1); tomli only where tomllib is missing (DD-41)
dependencies = ['tomli>=2; python_version < "3.11"']

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
  "tomli>=2",  # so mypy can check the Python 3.10 import branch
]

[project.scripts]
agenthalt = "agenthalt.cli:main"

[project.urls]
Homepage = "https://github.com/agentic-suite/agentsec-agenthalt"
Documentation = "https://github.com/agentic-suite/agentsec-agenthalt/tree/main/docs"
Issues = "https://github.com/agentic-suite/agentsec-agenthalt/issues"

[tool.setuptools.dynamic]
version = { attr = "agenthalt.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agenthalt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["agenthalt"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S603", "S607", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
