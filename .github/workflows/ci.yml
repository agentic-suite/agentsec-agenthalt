# agenthalt CI — the standing milestone gate (WBS 0.6): lint, types, tests, coverage >= 95%,
# plus a fresh-install smoke test. Every action is pinned to a commit SHA (OpenSSF Scorecard).
name: CI

on:
  push:
    branches: [main, "docs/v0.1.0-planning", "feat/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable + dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, zero violations)
        run: ruff check src tests && ruff format --check src tests

      - name: Types (mypy --strict)
        run: mypy

      - name: Tests + coverage (>= 95%)
        # These tests freeze real processes. A watchdog beside pytest (not above it) reports any
        # process outside the test sandboxes that stays stopped, names the test, and continues it,
        # so a stray SIGSTOP cannot wedge the runner and the log always comes back.
        timeout-minutes: 10
        env:
          AGENTHALT_TEST_STAMP: ${{ runner.temp }}/current-test
        run: |
          python .github/ci/stop_watchdog.py "$RUNNER_TEMP/watchdog.log" "$AGENTHALT_TEST_STAMP" 420 &
          watchdog=$!
          rc=0
          pytest -v -o faulthandler_timeout=60 \
            --cov=agenthalt --cov-report=term-missing --cov-fail-under=95 || rc=$?
          kill "$watchdog" 2>/dev/null || true
          echo "--- stop watchdog"; cat "$RUNNER_TEMP/watchdog.log"
          exit "$rc"

  install-smoke:
    name: pip install smoke (fresh, no cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install and run the CLI
        run: |
          python -m pip install --upgrade pip
          pip install .
          agenthalt --version
          agenthalt --help
          agenthalt doctor
